name: DrakoTV - instalador Windows

on:
  push:
    paths: ['drakotv/**', '.github/workflows/drakotv-windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: drakotv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drakotv/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DrakoTV-Windows
          path: |
            drakotv/dist/*.exe
          if-no-files-found: error
          retention-days: 30
