<div class="toprow">
  <a class="t t-ink t-logo" href="{% url 'accounts:landing' %}" aria-label="PulsoLive, inicio">
    <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M3 13h4l2.4-6 4.2 11 2.4-6.5H21" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <nav class="t t-ground t-links" aria-label="Secciones">
    <a href="{% url 'accounts:landing' %}#como-funciona">Cómo funciona</a><a href="{% url 'accounts:landing' %}#funciones">Funciones</a><a href="{% url 'accounts:pricing' %}">Precios</a><a href="{% url 'accounts:landing' %}#preguntas">Preguntas</a>
