{% extends "base_public.html" %}
{% block title %}Entrar{% endblock %}
{% block public %}
<section class="board auth">
  <div class="t t-paper auth-form">
    <h1>Entrar</h1>
    <form method="post">{% csrf_token %}
      {% if form.non_field_errors %}<ul class="errorlist"><li>Correo o contraseña incorrectos.</li></ul>{% endif %}
      <p><label for="id_username">Correo</label><input type="email" name="username" id="id_username" required autofocus autocomplete="email" value="{{ form.username.value|default:'' }}"></p>
      <p><label for="id_password">Contraseña</label><input type="password" name="password" id="id_password" required autocomplete="current-password"></p>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary btn-lg auth-btn" type="submit">Entrar</button>
    </form>
    <p class="auth-alt"><a href="{% url 'accounts:password_reset' %}">¿Olvidaste tu contraseña?</a> · <a href="{% url 'accounts:signup' %}">Crear cuenta</a></p>
  </div>
  {% include "accounts/_auth_side.html" %}
</section>
{% endblock %}
