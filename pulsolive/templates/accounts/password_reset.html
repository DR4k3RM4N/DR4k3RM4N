{% extends "base_public.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block public %}
<section class="board auth">
  <div class="t t-paper auth-form">
    <h1>Recuperar contraseña</h1>
    <p class="auth-sub">Te mandamos un link a tu correo para crear una nueva.</p>
    <form method="post">{% csrf_token %}{% include "accounts/_fields.html" %}<button class="btn btn-primary btn-lg auth-btn" type="submit">Enviar link</button></form>
  </div>
  {% include "accounts/_auth_side.html" %}
</section>
{% endblock %}
