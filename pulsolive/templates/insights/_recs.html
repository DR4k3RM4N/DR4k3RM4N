{% load pulso %}{% for r in recs %}
<div class="rec">
  <span class="badge {{ r.kind }}">{{ r.kind }}</span>
  <div><div class="title">{{ r.title }}</div><div class="detail">{% if brief %}{{ r.detail|brief }}.{% else %}{{ r.detail }}{% endif %}</div>{% if r.evidence and not brief %}<small>{{ r.evidence }}</small>{% endif %}</div>
</div>
{% empty %}<p class="muted">Sin recomendaciones todavía.</p>{% endfor %}
