# Render.com Blueprint para PulsoLive (planes gratis, para pruebas).
# Render → New → Blueprint → elige este repositorio y la rama → Apply.
services:
  - type: web
    name: pulsolive
    runtime: docker
    plan: free
    dockerContext: ./pulsolive
    dockerfilePath: ./pulsolive/Dockerfile
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pulsolive-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: pulsolive-db
    plan: free
