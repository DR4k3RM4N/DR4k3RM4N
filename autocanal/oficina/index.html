<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina AutoCanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
<header class="barra">
  <div class="marca"><span class="logo">▶</span> Oficina AutoCanal <span id="modo" class="chip chip-demo" hidden>MODO DEMO</span></div>
  <div class="conexion" id="conexion">conectando…</div>
</header>

<main class="layout">
  <section class="sala" id="sala">
    <div class="escenario">
      <canvas id="lienzo"></canvas>
      <div id="capas"></div>
    </div>
    <div class="ayuda">Haz clic en un agente para ver qué está haciendo</div>
  </section>

  <aside class="panel">
    <nav class="pestanas" role="tablist">
      <button class="pestana activa" data-tab="bandeja" role="tab">Bandeja <span id="cuenta" class="cuenta" hidden>0</span></button>
      <button class="pestana" data-tab="equipo" role="tab">Equipo</button>
      <button class="pestana" data-tab="proyectos" role="tab">Proyectos</button>
      <button class="pestana" data-tab="chat" role="tab">Chat</button>
    </nav>

    <div class="contenido" id="tab-bandeja">
      <form class="pedir" id="form-ideas">
        <label for="guia">Pídele ideas a Paola</label>
        <p class="pista">Escribe un tema para que busque (o déjalo vacío). Cada vez trae ideas nuevas.</p>
        <div class="fila">
          <input id="guia" placeholder="¿Algo en mente? Ej. apps de encuestas (opcional)" maxlength="300">
          <button class="btn btn-primario" type="submit">Pedir ideas</button>
        </div>
      </form>
      <div id="bandeja"></div>
    </div>
    <div class="contenido" id="tab-equipo" hidden><div id="equipo"></div></div>
    <div class="contenido" id="tab-proyectos" hidden><div id="proyectos"></div></div>
    <div class="contenido" id="tab-chat" hidden><ol id="chat" class="chat"></ol></div>
  </aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <button class="cerrar" id="modal-cerrar" aria-label="Cerrar">✕</button>
    <div id="modal-cuerpo"></div>
  </div>
</div>


<script src="/static/oficina.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
