<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Sala de edición central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/edicion.css">
</head>
<body>
<header class="ed-barra">
  <div class="ed-marca">
    <span class="ed-rec" aria-hidden="true"></span>
    <div>
      <h1>Sala de edición central</h1>
      <p>Todas las compus y el servidor editan los videos de todas las oficinas</p>
    </div>
  </div>
</header>

<main class="ed-main">
  <section class="ed-mando" aria-label="Controles">
    <button id="ed-todas" class="ed-boton ed-todas" type="button">
      <b>⚡ Usar todas las compus + servidor</b>
      <small id="ed-todas-sub">Apagado: el servidor no edita</small>
    </button>
    <button id="ed-reinicio" class="ed-boton ed-reinicio" type="button">
      <b>🔄 Reinicio forzoso</b>
      <small>Suelta lo trabado y lo vuelve a mandar</small>
    </button>
    <div class="ed-opciones">
      <label for="ed-srv-n">Videos a la vez en el servidor
        <select id="ed-srv-n"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
      </label>
      <label for="ed-cerebro">Cerebro de edición (videos del edificio)
        <select id="ed-cerebro">
          <option value="hibrido">🧠 Híbrido: Claude mientras haya plan, luego el director (no para)</option>
          <option value="auto">🎬 Solo director automático: no gasta tu plan</option>
        </select>
      </label>
    </div>
  </section>
  <p id="ed-aviso" class="ed-aviso" hidden></p>

  <div class="ed-vistas" role="tablist" aria-label="Qué ver">
    <button class="ed-vista activa" type="button" data-vista="tablero" role="tab">📊 Tablero</button>
    <button class="ed-vista" type="button" data-vista="cuarto" role="tab">💻 Tus compus: alta, códigos y proyectos</button>
  </div>
  <section id="ed-cuarto" class="ed-cuarto" hidden>
    <p class="ed-vacio">Aquí das de alta compus (código de 6 números), las quitas y abres tus proyectos de clips.</p>
    <iframe id="ed-cuarto-marco" title="El cuarto de edición" loading="lazy"></iframe>
  </section>
  <div id="ed-tablero">
  <section class="ed-cuarto-vivo" aria-label="El cuarto de control: cada compu y el servidor con lo que está editando">
    <div id="ed-cuarto-vivo"></div>
  </section>
  <section class="ed-resumen" id="ed-resumen" aria-live="polite"></section>

  <section>
    <h2>Máquinas</h2>
    <div class="ed-maquinas" id="ed-maquinas"></div>
  </section>

  <section class="ed-dos">
    <div>
      <h2>Por oficina</h2>
      <div id="ed-oficinas"></div>
    </div>
    <div>
      <h2>Fila y lo último</h2>
      <div id="ed-fila"></div>
    </div>
  </section>
  </div>
</main>
<script src="/static/nav.js"></script>
<script src="/static/cuarto.js"></script>
<script src="/static/edicion.js"></script>
</body>
</html>
