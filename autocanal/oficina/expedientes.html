<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>¿Quién MATÓ a…? · Agencia de Expedientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/estilo.css">
<link rel="stylesheet" href="/static/agencia.css">
</head>
<body class="agencia">
<div class="cinta-crimen" aria-hidden="true"></div>
<header class="ag-barra">
  <div class="ag-marca">
    <span class="ag-serie">¿Quién <b>MATÓ</b> a…?</span>
    <span class="ag-sub">Agencia de Expedientes</span>
  </div>
  <div class="ag-derecha">
    <span id="ag-caso" class="ag-caso" hidden></span>
    <a class="ag-volver" href="/edicion" title="Todas las compus y el servidor editando">🎬 Sala de edición</a>
    <a class="ag-volver" href="/" title="Regresar a la oficina principal">🏢 Oficina principal</a>
  </div>
</header>

<main class="ag-layout">
  <section class="ag-edificio" aria-label="La agencia: cubículos y el despacho del jefe">
    <div class="ag-plano">
      <canvas id="ag-lienzo" aria-hidden="true"></canvas>
      <div id="ag-capas" class="ag-capas"></div>
    </div>
    <div id="ag-ficha" class="ag-ficha" aria-live="polite">
      <p class="pista">Toca un cubículo o tu despacho para ver quién está y qué hace.</p>
    </div>
  </section>

  <aside class="ag-panel">
    <nav class="pestanas ag-pestanas" role="tablist">
      <button class="pestana activa" data-exp-tab="bandeja" role="tab">📥 Bandeja <span id="exp-cuenta" class="cuenta" hidden>0</span></button>
      <button class="pestana" data-exp-tab="temas" role="tab">🧾 Temas</button>
      <button class="pestana" data-exp-tab="casos" role="tab">🗂️ Casos</button>
      <button class="pestana" data-exp-tab="equipo" role="tab">👥 Equipo</button>
      <button class="pestana" data-exp-tab="agenda" role="tab">📅 Agenda</button>
      <button class="pestana" data-exp-tab="canales" role="tab">📺 Canales</button>
      <button class="pestana" data-exp-tab="chat" role="tab">💬 Chat</button>
    </nav>
    <div class="contenido" id="tab-exp-bandeja"><div id="exp-bandeja"></div></div>
    <div class="contenido" id="tab-exp-temas" hidden><div id="exp-temas"></div></div>
    <div class="contenido" id="tab-expedientes" hidden><div id="expedientes"></div></div>
    <div class="contenido" id="tab-exp-equipo" hidden><div id="exp-equipo"></div></div>
    <div class="contenido" id="tab-exp-agenda" hidden><div id="exp-agenda"></div></div>
    <div class="contenido" id="tab-exp-canales" hidden><div id="exp-canales"></div></div>
    <div class="contenido" id="tab-exp-chat" hidden><div id="exp-chat"></div></div>
  </aside>
</main>

<script src="/static/agencia.js"></script>
<script src="/static/expedientes.js"></script>
<script src="/static/agencia_panel.js"></script>
</body>
</html>
