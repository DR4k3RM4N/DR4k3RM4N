<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>¿Quién MATÓ a…? · Agencia de Expedientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/estilo.css">
<link rel="stylesheet" href="/static/agencia.css">
</head>
<body class="agencia">
<div class="cinta-crimen" aria-hidden="true"></div>
<header class="ag-barra">
  <div class="ag-marca">
    <span class="ag-serie">¿Quién <b>MATÓ</b> a…?</span>
    <span class="ag-sub">Agencia de Expedientes</span>
  </div>
  <div class="ag-derecha">
    <span id="ag-caso" class="ag-caso" hidden></span>
    <a class="ag-volver" href="/" title="Regresar a la oficina principal">🏢 Oficina principal</a>
  </div>
</header>

<main class="ag-layout">
  <section class="ag-edificio" aria-label="La agencia: cubículos y el despacho del jefe">
    <div class="ag-plano">
      <canvas id="ag-lienzo" aria-hidden="true"></canvas>
      <div id="ag-capas" class="ag-capas"></div>
    </div>
    <div id="ag-ficha" class="ag-ficha" aria-live="polite">
      <p class="pista">Toca un cubículo o tu despacho para ver quién está y qué hace.</p>
    </div>
  </section>

  <aside class="ag-panel">
    <div class="contenido" id="tab-expedientes"><div id="expedientes"></div></div>
  </aside>
</main>

<script src="/static/agencia.js"></script>
<script src="/static/expedientes.js"></script>
</body>
</html>
