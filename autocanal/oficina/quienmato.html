<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>¿Quién MATÓ a…?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  /* Layout: cinta de crimen + encabezado; el caso que va (pasos, barra, bitácora) a la izquierda; a la derecha
     el estado de lo que necesita la oficina, los próximos temas y los casos cerrados */
  :root { --fondo: #121212; --panel: #1b1b1d; --panel2: #232326; --borde: #2c2c30; --texto: #F5F5F5; --suave: #a3a29d;
    --am: #FFD60A; --rojo: #E63946; --verde: #2DC653; --titulo: "Bebas Neue", Impact, sans-serif; --sans: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 400 14px/1.5 var(--sans); }
  .cinta { height: 10px; background: repeating-linear-gradient(-45deg, var(--am) 0 26px, #111 26px 34px); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid #222; }
  header h1 { margin: 0; font: 400 34px/1 var(--titulo); letter-spacing: .02em; }
  header h1 b { color: var(--rojo); font-weight: 400; }
  header p { margin: 2px 0 0; color: var(--am); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .switch { display: flex; gap: 8px; align-items: center; }
  button, a.btn { font: 600 13px var(--sans); cursor: pointer; border-radius: 8px; border: 1px solid #3a3a40; background: #26262b; color: var(--texto);
    padding: 8px 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, button:focus-visible, a.btn:hover { border-color: var(--am); outline: none; }
  button:disabled { opacity: .5; cursor: default; }
  .am { background: var(--am); color: #111; border-color: var(--am); }
  main { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding-block: 16px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .tarjeta.actual { border-left: 4px solid var(--am); }
  h2 { margin: 0; font: 400 26px/1 var(--titulo); letter-spacing: .03em; }
  h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--suave); }
  .pista { margin: 0; color: var(--suave); font-size: 12.5px; }
  ol.pasos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ol.pasos li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--panel2); }
  ol.pasos li.trabajando { outline: 1px solid var(--am); }
  ol.pasos li.error { outline: 1px solid var(--rojo); }
  ol.pasos li .ico { font-size: 16px; text-align: center; }
  ol.pasos li small { display: block; color: var(--suave); overflow-wrap: anywhere; }
  ol.pasos li small.err { color: #ff9c9c; }
  .t { font: 600 12px var(--mono); color: var(--suave); white-space: nowrap; }
  .barra { height: 10px; background: #2a2a2e; border-radius: 6px; overflow: hidden; }
  .barra b { display: block; height: 100%; background: linear-gradient(90deg, var(--verde), var(--am)); transition: width .6s ease; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  ul.bitacora { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 4px;
    font-size: 12.5px; }
  ul.bitacora li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
  ul.bitacora li span:first-child { white-space: nowrap; }
  ul.bitacora li span:first-child { font: 600 11px var(--mono); color: var(--suave); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--borde); }
  .chip.ok { color: var(--verde); } .chip.no { color: #ff9c9c; border-color: #5a2a2a; }
  ul.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.lista li { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  ul.lista li span { min-width: 0; overflow-wrap: anywhere; }
  .mini { width: 100%; border-radius: 8px; display: block; }
  video { width: 100%; border-radius: 8px; background: #000; }
  .aviso { color: #ffd98a; margin: 0; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="cinta" aria-hidden="true"></div>
<header>
  <div><h1>¿Quién <b>MATÓ</b> a…?</h1><p>Oficina nueva · un caso a la vez, paso por paso</p></div>
  <div class="switch"><span id="estado-of" class="chip"></span><button id="prender" type="button"></button></div>
</header>
<main>
  <div class="col">
    <section class="tarjeta actual" id="actual" aria-live="polite"><p class="pista">Cargando…</p></section>
  </div>
  <div class="col">
    <section class="tarjeta"><h3>Lo que necesita la oficina</h3><div class="chips" id="necesita"></div>
      <p class="pista">Investigación y guion usan tu plan de Claude; la voz es Azure en el servidor; el video lo hacen tus compus (o el servidor si no hay).</p></section>
    <section class="tarjeta"><h3>Siguen</h3><ul class="lista" id="temas"></ul></section>
    <section class="tarjeta"><h3>Casos cerrados</h3><ul class="lista" id="hechos"></ul></section>
  </div>
  <p class="aviso" id="aviso" hidden></p>
</main>
<script src="/static/nav.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ICO = { listo: "✅", trabajando: "⏳", error: "⚠️", esperando: "⏸️", pendiente: "○" };
  let d = null;
  const dur = (s) => (s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`);
  const hace = (t) => (t ? `hace ${dur(Math.max(0, d.ahora - t))}` : "");
  const hora = (t) => new Date(t * 1000).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
  async function api(cuerpo) {
    const r = await fetch("/api/quienmato", cuerpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) } : {});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
    return j;
  }
  function pintar() {
    $("#estado-of").textContent = d.activa ? (d.trabajando ? "🟢 trabajando" : "🟢 prendida") : "⏸️ pausada";
    $("#prender").textContent = d.activa ? "⏸ Pausar" : "▶ Prender";
    $("#prender").className = d.activa ? "" : "am";
    const c = d.casos.find((x) => x.id === d.actual);
    if (!c) {
      $("#actual").innerHTML = `<h2>Sin caso en marcha</h2><p class="pista">${d.activa ? (d.plan ? "Tomando el siguiente tema…" : "Esperando a que se restablezca tu plan de Claude para empezar el siguiente.") : "La oficina está pausada: dale ▶ Prender."}</p>`;
    } else {
      const hechos = c.pasos.filter((p) => p.estado === "listo").length;
      const va = c.pasos.find((p) => p.clave === c.paso);
      const pct = Math.round(((hechos + (va && va.estado === "trabajando" && va.avance ? va.avance : 0)) / c.pasos.length) * 100);
      const err = c.pasos.find((p) => p.estado === "error");
      const quieto = c.mov && d.ahora - c.mov > 1200 && !err;
      $("#actual").innerHTML = `<h2>#${esc(c.numero)} · ¿Quién MATÓ a ${esc(c.marca)}?</h2>
        <div class="barra" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><b style="width:${pct}%"></b></div>
        <p class="pista">${pct} % · último movimiento ${esc(hace(c.mov))}${quieto ? " · ⚠️ lleva rato quieto: dale «Reintentar paso»" : ""}</p>
        <ol class="pasos">${c.pasos.map((p) => {
          const t = p.estado === "trabajando" && p.inicio ? dur(d.ahora - p.inicio) : p.inicio && p.fin ? dur(p.fin - p.inicio) : "";
          return `<li class="${esc(p.estado)}"><span class="ico">${ICO[p.estado] || "○"}</span><span><b>${esc(p.nombre)}</b>
            ${p.estado === "error" ? `<small class="err">${esc(p.error)} (intento ${esc(p.intentos)} de 3${p.intentos >= 3 ? " · espera tu «Reintentar paso»" : " · se reintenta solo en 10 min"})</small>`
              : p.detalle && p.estado !== "listo" ? `<small>${esc(p.detalle)}${p.avance ? ` · ${Math.round(p.avance * 100)} %` : ""}</small>` : ""}</span>
            <span class="t">${esc(t)}</span></li>`; }).join("")}</ol>
        <div class="fila"><button type="button" class="am" data-a="reintentar">▶ Reintentar paso</button>
          ${c.video ? `<button type="button" data-a="rehacer_video">🔁 Rehacer video</button>` : ""}
          <button type="button" data-a="saltar">⏭ Saltar este caso</button></div>
        ${c.video ? `<video controls preload="metadata" src="/quienmato-archivo/${encodeURIComponent(c.id)}/video.mp4"></video>` : ""}
        <h3>Bitácora</h3><ul class="bitacora">${[...(c.log || [])].reverse().map((l) => `<li><span>${esc(hora(l.t))}</span><span>${esc(l.texto)}</span></li>`).join("")}</ul>`;
    }
    const n = (ok, si, no) => `<span class="chip ${ok ? "ok" : "no"}">${ok ? "✔" : "✖"} ${esc(ok ? si : no)}</span>`;
    $("#necesita").innerHTML = n(d.plan, "Plan de Claude con uso", "Plan de Claude en pausa (sigue solo cuando vuelva)") + n(d.azure, "Voz de Azure", "Falta la clave de Azure en el servidor")
      + n(d.canal, "Canal de YouTube ligado", "Falta elegir el canal de YouTube") + n(d.compus > 0, `${d.compus} compu(s) con el kit de animación`, "Sin compu con kit: el video lo hace el servidor");
    $("#temas").innerHTML = d.temas.length ? d.temas.map((t) => `<li><span><b>${esc(t.marca)}</b>${t.gancho ? ` · ${esc(t.gancho)}` : ""}</span></li>`).join("")
      : `<li><span class="pista">Sin temas en fila: el equipo propondrá más.</span></li>`;
    const hechos = d.casos.filter((x) => x.hecho);
    $("#hechos").innerHTML = hechos.length ? hechos.map((x) => `<li><span><b>#${esc(x.numero)} ${esc(x.marca)}</b>${x.programado ? ` · sale el ${esc(x.programado)}` : ""}</span>
      <span class="fila">${x.url ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">▶ YouTube</a>` : ""}
      ${x.miniatura ? `<a class="btn" href="/quienmato-archivo/${encodeURIComponent(x.id)}/miniatura.jpg" target="_blank" rel="noopener">🖼️</a>` : ""}</span></li>`).join("")
      : `<li><span class="pista">Todavía ninguno: el primero sale en cuanto termine el caso de arriba.</span></li>`;
  }
  async function cargar() {
    if ([...document.querySelectorAll("video")].some((v) => !v.paused)) return;
    try { d = await api(); pintar(); } catch (err) { $("#aviso").hidden = false; $("#aviso").textContent = err.message; }
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const a = b.id === "prender" ? (d.activa ? "pausar" : "prender") : b.dataset.a;
    if (!a) return;
    if (a === "saltar" && !confirm("¿Saltar este caso? Se queda guardado lo que lleva, pero la oficina sigue con el siguiente tema.")) return;
    b.disabled = true;
    try { await api({ accion: a, caso: d.actual }); } catch (err) { alert(err.message); }
    b.disabled = false;
    cargar();
  });
  cargar();
  setInterval(() => { if (!document.hidden) cargar(); }, 5000);
})();
</script>
</body>
</html>
